# Self-hosted Flux: the proxy, its usage database, and the operator dashboard.
#
#   docker compose up -d
#   curl localhost:8000/health
#
# Provider keys are read from your shell (or a .env file beside this one) and
# are never baked into the image. They stay on this machine — that is the whole
# point of running Flux yourself.

services:
  flux:
    build: .
    image: flux-router:local
    # Published on this machine only. Change to "8000:8000" to expose it on
    # the network — and set FLUX_SERVER_TOKEN below before you do.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Provider keys — set whichever you use, in your shell or a .env file.
      # The `:-` default keeps compose from failing on the ones you don't.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"

      # REQUIRED. Unlike a bare `flux serve` on the
      # host, a container can never see a loopback client: the proxy binds
      # 0.0.0.0 inside the container and requests arrive from the docker
      # bridge, so the dashboard's "loopback callers only" allowance never
      # applies — even when the port is published to 127.0.0.1 as above.
      # Setting a token makes the container start and the dashboard serve; paste
      # the same value into the dashboard's token prompt on first load.
      #   FLUX_SERVER_TOKEN=$(openssl rand -hex 32) docker compose up -d
      FLUX_SERVER_TOKEN: "${FLUX_SERVER_TOKEN:?Set FLUX_SERVER_TOKEN to a strong random value}"

      # Set to 0 for a headless deployment that serves the API only.
      FLUX_DASHBOARD: "1"

    # Named volume so the usage database — and with it every number the
    # dashboard shows — survives `docker compose down` and image rebuilds.
    # FLUX_DATA_DIR is set to /data in the Dockerfile.
    volumes:
      - flux-data:/data

    restart: unless-stopped

    # Mirrors the image's HEALTHCHECK; repeated here so `docker compose ps`
    # reports health even when the image is overridden.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  flux-data:
