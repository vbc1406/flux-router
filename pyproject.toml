[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-router"
version = "1.0.0"
description = "Intelligent LLM routing engine. Save 30-50% on AI costs automatically."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Flux", email = "fluxllmdev@gmail.com"}]
keywords = ["llm", "routing", "ai", "cost-optimization", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "structlog>=24.0,<25.0",
    # Used by the shipped router.demo and router.benchmark modules.
    "rich>=13.0,<15.0",
]

[project.scripts]
flux = "router.cli:main"

[project.urls]
Homepage = "https://github.com/vbc1406/flux"
Repository = "https://github.com/vbc1406/flux"
Issues = "https://github.com/vbc1406/flux/issues"
Changelog = "https://github.com/vbc1406/flux/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "pytest-timeout>=2.0,<3.0",
    "mypy>=1.0,<2.0",
    "ruff>=0.1.0,<1.0",
    "bandit>=1.7,<2.0",
    "safety>=3.0,<4.0",
    "pip-audit>=2.0,<3.0",
    "hypothesis>=6.0,<7.0",
    # In-memory Redis fake for RedisRunStore tests — no real server required.
    "fakeredis>=2.20,<3.0",
    # fastapi.testclient (test_server.py, test_stats.py) is built on
    # starlette's TestClient, which needs httpx or it raises at import and
    # takes the whole file down at collection. Declared explicitly: it was
    # previously present only as a transitive dependency of `safety`.
    "httpx>=0.27,<1.0",
]
# Only needed to pull the full public benchmarks for `python -m router.evals
# --live --source hub`. The harness runs offline (fixtures + simulated
# completions) without it.
evals = [
    "datasets>=2.0,<4.0",
]
# OpenAI-compatible HTTP proxy (router/server.py). Not a core dependency —
# import-time users of `router.flux` / `router.routing_engine` should never
# need an ASGI server pulled in.
server = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]
# RedisRunStore (router/run_budget.py) — only needed when FLUX_RUN_STORE=redis
# selects a shared run-budget store for multi-worker deployments. The default
# InMemoryRunStore has no extra dependencies.
redis = [
    "redis>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["router*"]
exclude = ["testing*", "tests*", "router.tests*"]

[tool.setuptools.package-data]
# The dashboard is plain HTML/CSS/JS with no build step, so the sources ship
# as-is and `pip install flux-router[server]` is the whole install — no Node,
# no bundler, nothing fetched at runtime.
router = ["models.json", "dashboard/*"]

[tool.setuptools.exclude-package-data]
router = ["tests/*", "tests/**/*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S", "C4", "SIM"]
ignore = [
    "S101",
    "S603",
    "S311",  # non-cryptographic random — used for A/B exploration, not crypto
    "S310",  # urlopen — mitigated by https-only scheme check in provider_caller
]

[tool.ruff.lint.per-file-ignores]
# S104 ("0.0.0.0") is unavoidable in tests/: the dashboard mount guard and the
# CLI's bind-address handling are *about* non-loopback addresses, so the string
# has to appear as test data. Nothing in tests/ binds a socket.
"router/tests/*" = ["S101", "S104", "S105", "S106", "F841"]

[tool.pytest.ini_options]
testpaths = ["router/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --timeout=30"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring external services",
]

[tool.bandit]
exclude_dirs = ["router/tests", "testing"]
skips = ["B101"]
