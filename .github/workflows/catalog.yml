name: Provider catalog validation

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "router/models.json"
      - "scripts/validate_model_catalog.py"
  # A direct push to main touching the catalog (bypassing a path-filtered PR
  # entirely, e.g. a maintainer pushing straight to main) was previously only
  # caught by the Monday cron, not at push time.
  push:
    branches: [main]
    paths:
      - "router/models.json"
      - "scripts/validate_model_catalog.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate schema and official model identifiers
        run: python scripts/validate_model_catalog.py --online
