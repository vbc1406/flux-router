name: Publish to PyPI

# Triggered by pushing a tag like `v1.0.0`. The tag version and the
# `[project.version]` in pyproject.toml must match exactly, or the build
# step below fails the release before anything is uploaded.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Validate the built wheel actually installs and works before it's published —
  # a broken release can't be un-yanked from someone's lockfile fast enough to
  # matter, so this must pass before publish runs.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Import, construct, and run the keyless demo
        run: |
          python -c "import router; from router.flux import make_flux; make_flux()"
          python -m router.demo

      # The library alone is not the product any more. Everything below runs
      # against the `server` extra, from a directory that is not the source
      # checkout — so a missing package-data entry (the dashboard assets ship
      # as files, not code) fails the release instead of shipping broken.
      - name: Install the server extra
        run: python -m pip install "$(ls dist/*.whl)[server]"

      - name: Boot flux serve and exercise the endpoints
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          flux version
          flux serve --data-dir ./fluxdata --port 8000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/health >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then echo "server did not become healthy" >&2; exit 1; fi
            sleep 1
          done

          # The dashboard is package data — this is what catches it going missing.
          curl -fsS localhost:8000/dashboard/ >/dev/null
          curl -fsS localhost:8000/dashboard/app.js >/dev/null
          curl -fsS "localhost:8000/v1/stats/summary?window=24h" >/dev/null
          curl -fsS localhost:8000/v1/stats/registry >/dev/null
          curl -fsS localhost:8000/v1/models >/dev/null

          # `flux serve` is persistent-by-default; an empty data dir means the
          # database silently went back to ":memory:".
          test -f ./fluxdata/flux.db

      - name: Refuse to bind off-loopback with no token
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          # An unauthenticated non-loopback bind must fail closed at startup —
          # the process should exit before it ever opens the port.
          if FLUX_SERVER_HOST=0.0.0.0 timeout 10 flux serve --data-dir ./fluxdata --port 8001; then
            echo "server started despite an unauthenticated non-loopback bind" >&2
            exit 1
          fi

          if curl -fsS --max-time 2 localhost:8001/health >/dev/null 2>&1; then
            echo "server is reachable despite refusing to bind" >&2
            exit 1
          fi

  # Trusted publishing (OIDC) — no PyPI API token stored in repo secrets.
  # One-time setup required on pypi.org: Project settings > Publishing >
  # add a trusted publisher for this repo/workflow/environment.
  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flux-router/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
