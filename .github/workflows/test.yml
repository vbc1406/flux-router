name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-server.txt -r requirements-dev.txt

      - name: Run ruff
        run: ruff check router/

      # Blocking: these paths are strict-clean (see CHANGELOG "Item 8") and
      # must stay that way. Listed explicitly rather than `router/` so a
      # new mypy error anywhere else in the tree can't fail CI until that
      # file is deliberately added to this list. --follow-imports=silent is
      # required: without it mypy also reports pre-existing errors from
      # every module these files import (schemas.py, classifier.py, etc.)
      # even though only the 8 listed paths are meant to be checked —
      # silent still uses their type info for cross-module checking, it
      # just doesn't emit diagnostics for their bodies.
      - name: Run mypy (strict, blocking — hardened paths)
        run: |
          mypy --strict --follow-imports=silent \
            router/provider_caller.py \
            router/flux.py \
            router/routing_engine.py \
            router/run_budget.py \
            router/budget_tracker.py \
            router/attribution.py \
            router/server.py \
            router/evals/

      # Informational only: the rest of router/ isn't strict-clean yet.
      - name: Run mypy (strict, informational — full tree)
        run: mypy --strict router/ || true
        continue-on-error: true

      - name: Run pytest
        run: pytest router/tests/ -v --timeout=30

      - name: Run eval harness smoke (mock, offline)
        run: python -m router.evals --n 5

  # Validate the actual installable package (not the editable/dev setup): a
  # clean `pip install .` must import and expose make_flux, and the shipped
  # demo must run. This catches missing runtime deps and Python-version import
  # breaks that the dev install (-r requirements*.txt) would otherwise hide.
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the built package only
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Import and construct from a clean install
        run: python -c "import router; from router.flux import make_flux; make_flux()"

      - name: Run the keyless demo
        run: python -m router.demo

      # Regression guard: evals/fixtures/*.json previously shipped only in
      # the editable/dev checkout, not the built wheel/sdist — `python -m
      # router.evals` (mock mode, no extra needed) crashed with
      # FileNotFoundError on any real install. Nothing else in this workflow
      # installs the actual package and runs it, so this is the only job
      # that would have caught it.
      - name: Run the eval harness mock smoke against the installed package
        run: python -m router.evals --n 3

  # Validate the container image and docker-compose.yml. A GitHub runner is the
  # clean VM this would otherwise need: the image is built from scratch, booted,
  # and checked for the three things that make the self-hosted story work — the
  # API serves, the usage database survives a restart on its volume, and the
  # dashboard is not exposed without a token.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t flux-router:ci .

      # The image binds 0.0.0.0 inside the container. Hardened startup must
      # fail closed when that non-loopback bind has no authentication.
      - name: Container refuses an unauthenticated non-loopback bind
        run: |
          set -euo pipefail
          docker run --name flux-notoken -p 8000:8000 flux-router:ci || true
          trap 'docker rm -f flux-notoken >/dev/null 2>&1 || true' EXIT
          STATUS="$(docker inspect -f '{{.State.Status}}' flux-notoken)"
          if [ "$STATUS" = "running" ]; then
            echo "container remained running without authentication" >&2
            docker logs flux-notoken
            exit 1
          fi
          docker logs flux-notoken 2>&1 | grep -q "Refusing unauthenticated server bind"

      - name: Dashboard is served, and the API is locked, with a token
        run: |
          set -euo pipefail
          docker run -d --name flux-token -p 8001:8000 \
            -e FLUX_SERVER_TOKEN=ci-test-token flux-router:ci
          trap 'docker rm -f flux-token >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS localhost:8001/health >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then docker logs flux-token; exit 1; fi
            sleep 1
          done

          curl -fsS localhost:8001/dashboard/ >/dev/null
          curl -fsS localhost:8001/dashboard/app.js >/dev/null

          # The stats the dashboard reads must require the token.
          UNAUTH="$(curl -s -o /dev/null -w '%{http_code}' localhost:8001/v1/stats/summary)"
          if [ "$UNAUTH" != "401" ]; then
            echo "stats served without the token (got $UNAUTH)" >&2
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer ci-test-token" \
            localhost:8001/v1/stats/summary >/dev/null

      # The point of the volume: `docker restart` must not lose spend history.
      - name: Usage database survives a container restart
        run: |
          set -euo pipefail
          docker volume create flux-ci-data >/dev/null
          docker run -d --name flux-persist -p 8002:8000 \
            -e FLUX_SERVER_TOKEN=ci-persist-token \
            -v flux-ci-data:/data flux-router:ci
          cleanup() {
            docker rm -f flux-persist >/dev/null 2>&1 || true
            docker volume rm flux-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS localhost:8002/health >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then docker logs flux-persist; exit 1; fi
            sleep 1
          done

          # Write a usage row directly (no provider keys in CI, so no real call
          # to generate one). count() flushes the background writer first.
          docker exec -i flux-persist python - <<'PY'
          import time
          from router.attribution import SqliteUsageStore, UsageRecord

          store = SqliteUsageStore("/data/flux.db")
          store.record(UsageRecord(tenant_id="ci", run_id="r1", task_type="t",
                                   step_type="s", model_id="m1", cost_usd=0.01,
                                   timestamp=time.time()))
          assert store.count() == 1, store.count()
          PY

          # DEBUG: prove the row is actually on disk before we restart anything.
          echo "--- /data before restart ---"
          docker exec flux-persist ls -la /data
          docker exec flux-persist python3 -c "
          import sqlite3
          conn = sqlite3.connect('/data/flux.db')
          print('pre-restart row count:', conn.execute('SELECT COUNT(*) FROM usage').fetchone())
          print('journal_mode:', conn.execute('PRAGMA journal_mode').fetchone())
          "

          docker restart flux-persist
          for i in $(seq 1 30); do
            if curl -fsS localhost:8002/health >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then docker logs flux-persist; exit 1; fi
            sleep 1
          done

          # DEBUG: check the file on disk directly, bypassing the HTTP/app layer
          # entirely, to tell a storage-layer loss apart from an app-layer bug.
          echo "--- /data after restart ---"
          docker exec flux-persist ls -la /data
          docker exec flux-persist python3 -c "
          import sqlite3
          conn = sqlite3.connect('/data/flux.db')
          print('post-restart row count (raw sqlite):', conn.execute('SELECT COUNT(*) FROM usage').fetchone())
          print('post-restart rows:', conn.execute('SELECT * FROM usage').fetchall())
          "
          docker logs flux-persist

          REQUESTS="$(curl -fsS -H 'Authorization: Bearer ci-persist-token' \
            'localhost:8002/v1/stats/summary?window=all' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["requests"])')"
          if [ "$REQUESTS" != "1" ]; then
            echo "usage row did not survive the restart (requests=$REQUESTS)" >&2
            exit 1
          fi

      - name: docker compose brings the stack up
        run: |
          set -euo pipefail
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT
          FLUX_SERVER_TOKEN=ci-compose-token docker compose up -d --build

          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/health >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then docker compose logs; exit 1; fi
            sleep 1
          done

          curl -fsS localhost:8000/dashboard/ >/dev/null
          curl -fsS -H "Authorization: Bearer ci-compose-token" \
            "localhost:8000/v1/stats/summary?window=24h" >/dev/null
